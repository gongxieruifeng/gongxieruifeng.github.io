<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">03_资产规划与编译</title>
<desc id="desc">CompileLight conceptual architecture, grounded in the business homepage and public reference commit f5c9f03bf2b98a287f744c3d9611b985fbd1e192. LLM proposes, deterministic code approves. System 2 tools are optional and allowlisted; validated typed artifacts enter fixed execution. The public implementation resolves System 2 gaps before submitting results to the fixed executor. Routing sequences are illustrative: NEW may retain known steps. Compiler gates are grouped, not exhaustive. REUSE avoids additional decision inference in deterministic execution steps, not in the complete control plane. Ledger review is not automatic live asset mutation.</desc>
