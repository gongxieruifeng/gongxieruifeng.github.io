<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龚谢蕊烽 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #f5f5f5;
            color: #141414;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 60px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #141414;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #2563eb;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: #2563eb;
            margin: 0 auto 32px;
        }

        .bio {
            font-size: 1rem;
            color: #555;
            margin-bottom: 32px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .tag {
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .link-btn.primary {
            background: #2563eb;
            color: white;
        }

        .link-btn.primary:hover {
            background: #1d4ed8;
        }

        .link-btn.secondary {
            border: 1px solid #d1d5db;
            color: #374151;
        }

        .link-btn.secondary:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        @media (max-width: 640px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 2rem;
            }

            .links {
                flex-direction: column;
            }

            .link-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>龚谢蕊烽</h1>
        <div class="subtitle">Agent 算法 · AI 应用开发 · 大模型系统</div>
        <div class="divider"></div>
        <p class="bio">
            四川大学电子信息硕士在读，研究方向为大模型智能体与空间推理。
            聚焦多模态、图推理、时空建模与 Agent 系统，热爱构建可落地、可审计的 AI 应用。
        </p>
        <div class="tags">
            <span class="tag">Agent</span>
            <span class="tag">LangGraph</span>
            <span class="tag">RAG</span>
            <span class="tag">大模型微调</span>
            <span class="tag">时空预测</span>
            <span class="tag">PyTorch</span>
        </div>
        <div class="links">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>

        </div>
        <div class="footer">
            <p>🚧 网站建设中 · 作品集与简历页面即将上线</p>
            <p style="margin-top: 8px;">© 2026 龚谢蕊烽</p>
        </div>
    </div>
</body>
</html>
